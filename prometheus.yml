global:
  scrape_interval: 10s # kriteria: collecting period 10 detik

scrape_configs:
  - job_name: "jenkins"
    metrics_path: /prom # kriteria: path diubah ke /prom (bukan /prometheus)
    static_configs:
      - targets: ["jenkins:8080"] # ganti sesuai host:port Jenkins-mu (mis. localhost:8080 atau <ip-ec2>:8080)
